name: Build and Publish Docker Container

on:
  push:
    branches:
      - main
      - enhance1.0
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Go Source
    runs-on: ubuntu-latest
    steps:
      - name: Check out Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Patch Dependency Go Version
        run: |
          set -euo pipefail
          git clone https://github.com/ovrlord-app/releasetitleparser /tmp/rtp
          cd /tmp/rtp
          git checkout 4c9e25386576
          sed -i 's/go 1.25/go 1.22/g' go.mod
          if [ ! -f go.mod ] || [ ! -s go.mod ]; then
            {
              echo "module github.com/ovrlord-app/releasetitleparser"
              echo "go 1.22"
            } > go.mod
          fi
          cd "${GITHUB_WORKSPACE}"
          go mod edit -replace github.com/ovrlord-app/releasetitleparser=/tmp/rtp

      - name: Resolve and Verify Go Modules
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify

      - name: Report Go Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "Existing Go files that are not gofmt formatted:"
            echo "${unformatted}"
          else
            echo "All Go files are gofmt formatted."
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -count=1 ./...

      - name: Run Race Detector
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...

  publish:
    name: Build and Push Docker Image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (For Multi-Platform Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
