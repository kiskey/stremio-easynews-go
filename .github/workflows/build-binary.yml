name: Build Stremio Easynews Binary

on:
  push:
    branches:
      - main
      - enhance1.0
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - enhance1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify and Compile Statically Linked Alpine Binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Patch Dependency Go Version
        run: |
          set -euo pipefail
          git clone https://github.com/ovrlord-app/releasetitleparser /tmp/rtp
          cd /tmp/rtp
          git checkout 4c9e25386576
          sed -i 's/go 1.25/go 1.22/g' go.mod
          if [ ! -f go.mod ] || [ ! -s go.mod ]; then
            {
              echo "module github.com/ovrlord-app/releasetitleparser"
              echo "go 1.22"
            } > go.mod
          fi
          cd "${GITHUB_WORKSPACE}"
          go mod edit -replace github.com/ovrlord-app/releasetitleparser=/tmp/rtp

      - name: Resolve and Verify Go Modules
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify

      - name: Report Go Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "Existing Go files that are not gofmt formatted:"
            echo "${unformatted}"
          else
            echo "All Go files are gofmt formatted."
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -count=1 ./...

      - name: Run Race Detector
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...

      - name: Extract Release Version
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> "${GITHUB_OUTPUT}"
          else
            echo "VERSION=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compile Go Executable (Linux AMD64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p bin
          go build \
            -trimpath \
            -ldflags="-s -w -X github.com/kiskey/stremio-easynews-go/internal/shared.Version=${{ steps.vars.outputs.VERSION }}" \
            -o bin/stremio-easynews-linux-amd64 \
            cmd/addon/main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremio-easynews-linux-amd64
          path: bin/stremio-easynews-linux-amd64
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/stremio-easynews-linux-amd64
          name: Release ${{ steps.vars.outputs.VERSION }}
          tag_name: ${{ steps.vars.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
